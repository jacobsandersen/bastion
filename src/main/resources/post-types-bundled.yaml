bastion:
  post-types:
    roots: [entry]
    fallback: note
    common-properties:
      - published
      - updated
      - category
      - post-status
      - visibility
      - mp-syndicate-to

    defaults:
      syndication:
        format: "{excerpt}\n\n{url}"
        overflow-format: "{url}"

    types:
      - type: note
        name: Note
        h: entry
        properties: [content]
        required-properties: [content, published]

      - type: article
        name: Article
        h: entry
        properties: [name, content, summary]
        required-properties: [content, name, published, summary]
        syndication:
          format: "{name}: {excerpt}\n\n{url}"
          fallback-format: "{excerpt}\n\n{url}"
          overflow-format: "{name}\n\n{url}"

      - type: reply
        name: Reply
        h: entry
        properties: [in-reply-to, content]
        required-properties: [content, in-reply-to, published]

      - type: repost
        name: Repost
        h: entry
        properties: [repost-of]
        required-properties: [repost-of, published]

      - type: like
        name: Like
        h: entry
        properties: [like-of]
        required-properties: [like-of, published]

      - type: rsvp
        name: RSVP
        h: entry
        properties: [rsvp, in-reply-to]
        required-properties: [in-reply-to, published, rsvp]

      - type: photo
        name: Photo
        h: entry
        properties: [photo]
        required-properties: [photo, published]

      - type: video
        name: Video
        h: entry
        properties: [video]
        required-properties: [video, published]

    discovery:
      - id: rsvp
        type: rsvp
        match:
          property: rsvp
          value:
            one-of: ["yes", "no", "maybe", "interested"]

      - id: reply
        type: reply
        match:
          property: in-reply-to
          value:
            url: true

      - id: repost
        type: repost
        match:
          property: repost-of
          value:
            url: true

      - id: like
        type: like
        match:
          property: like-of
          value:
            url: true

      - id: video
        type: video
        match:
          property: video
          value:
            url: true

      - id: photo
        type: photo
        match:
          property: photo
          value:
            url: true

      - id: article
        type: article
        match:
          all:
            - property: name
              value:
                text: true
            - any:
                - property: content
                  value:
                    text: true
                - property: summary
                  value:
                    text: true
            - not:
                name-prefix-of: [content, summary]
